name: Deploy to Hostinger

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          cd domains/lingku.xyz/nodejs
          git pull origin master
          /opt/alt/alt-nodejs22/root/bin/npm install --production
          # Safer restart logic
          pkill -u u427900331 node || true
          sleep 2
          nohup /opt/alt/alt-nodejs22/root/bin/node server.js > out.log 2> err.log &
          sleep 2
