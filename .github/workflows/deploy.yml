name: Deploy to Hostinger

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          cd domains/lingku.xyz/nodejs
          # Ambil data terbaru dan paksa reset agar sama persis dengan GitHub
          git fetch origin master
          git reset --hard origin/master
          
          /opt/alt/alt-nodejs22/root/bin/npm install --production
          
          # Matikan proses lama dan jalankan ulang
          pkill -u u427900331 node || true
          sleep 3
          nohup /opt/alt/alt-nodejs22/root/bin/node server.js > out.log 2> err.log &
          sleep 5
          # Cek apakah sudah jalan
          ps aux | grep node | grep server.js
