name: Deploy to Hostinger

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        timeout: 60s
        command_timeout: 30m
        script: |
          cd domains/lingku.xyz/nodejs
          # Ambil data terbaru dan paksa reset agar sama persis dengan GitHub
          git fetch origin master
          git reset --hard origin/master
          
          # Hapus log lama agar tidak menumpuk
          rm -f out.log err.log
          
          # Install dengan mode hemat memori
          /opt/alt/alt-nodejs22/root/bin/npm install --production --no-audit --no-fund
          
          # Matikan proses lama dan jalankan ulang dengan pemutusan koneksi yang benar
          pkill -u u427900331 node || true
          sleep 2
          nohup /opt/alt/alt-nodejs22/root/bin/node server.js < /dev/null > out.log 2> err.log &
          sleep 5
          
          # Verifikasi keberhasilan
          if pgrep -f "node server.js" > /dev/null; then
            echo "🚀 Server berhasil dijalankan!"
          else
            echo "❌ Gagal menjalankan server. Cek err.log"
            exit 1
          fi
