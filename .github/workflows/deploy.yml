name: Deploy to Hostinger

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Build archive (exclude secrets/uploads/node_modules)
      run: |
        tar -czf app.tar.gz \
          --exclude='./node_modules' \
          --exclude='./.git' \
          --exclude='./.env' \
          --exclude='./.env.*' \
          --exclude='./public/uploads' \
          --exclude='./backups' \
          --exclude='./npm-cache' \
          --exclude='./scratch' \
          --exclude='./Tutorial' \
          --exclude='*.log' \
          .
        ls -lh app.tar.gz

    - name: Upload archive to server
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: 65002
        source: app.tar.gz
        target: domains/lingku.xyz/nodejs

    - name: Extract & restart server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: 65002
        script: |
          set -e
          cd domains/lingku.xyz/nodejs
          tar -xzf app.tar.gz
          rm -f app.tar.gz
          rm -f out.log err.log
          /opt/alt/alt-nodejs22/root/bin/npm install --production --no-audit --no-fund
          pkill -u u427900331 node || true
          sleep 2
          nohup /opt/alt/alt-nodejs22/root/bin/node server.js < /dev/null > out.log 2> err.log &
          sleep 5
          if pgrep -f "node server.js" > /dev/null; then
            echo "🚀 Server berhasil dijalankan!"
          else
            echo "❌ Gagal menjalankan server. Cek err.log"
            exit 1
          fi
